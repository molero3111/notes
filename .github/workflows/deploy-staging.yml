# Deploy to VPS when code is pushed/merged to staging.

name: Deploy to Staging (VPS)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    name: Deploy frontend to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          missing=""
          [ -z "${{ secrets.VPS_HOST }}" ] && missing="${missing}VPS_HOST "
          [ -z "${{ secrets.VPS_USERNAME }}" ] && missing="${missing}VPS_USERNAME "
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && missing="${missing}SSH_PRIVATE_KEY "
          [ -z "${{ secrets.SSH_PORT }}" ] && missing="${missing}SSH_PORT "
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty repository secrets: ${missing}. Add them in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "All required secrets are set."
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/emmanuel/notes_crud/frontend
            git fetch origin
            git checkout staging
            git pull origin staging
            npm ci
            npm run build
            rsync -av --delete --no-owner --no-group dist/ /var/www/notes/
            echo "Deploy finished. Static files updated in /var/www/notes"
