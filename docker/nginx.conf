# Docker's embedded DNS. Resolving notes-api per request (via the variable in
# proxy_pass) lets nginx start even when the API container is not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# cloudflared sends X-Forwarded-Proto: https; fall back to our own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    set $notes_api http://notes-api:8000;

    location ^~ /api/ {
        proxy_pass $notes_api;
        include /etc/nginx/proxy_params_notes;
    }

    location ^~ /admin/ {
        proxy_pass $notes_api;
        include /etc/nginx/proxy_params_notes;
    }

    location ^~ /static/ {
        proxy_pass $notes_api;
        include /etc/nginx/proxy_params_notes;
    }

    # Vite emits content-hashed filenames under /assets/, safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback for client-side routes.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
